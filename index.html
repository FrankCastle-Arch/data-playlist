<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Playlist</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.min.css">
	<link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main>
	<center>
	<section class="card">
		<h1>My Playlist</h1>
		<br>
		<p>Live chart-topping songs, served by an API I built and deployed myself.</p>
		<br>
	<button id="prev-button" type="button">Previous track</button>
	<button id="song-button" type="button">Songs from the top 50</button>
	<button id="next-button" type="button">Next track</button>
	<article>
		<span class="now-playing-icon"></span>
		<h2 id="track-name"></h2>
		<p id="track-facts"></p>
	</section>
	 </center>
    </main>
    <script src="script.js"></script>
</article>
  </body>
</html>
